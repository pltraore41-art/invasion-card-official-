services:
  - type: web
    name: invasion-cardigan-django
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput
    startCommand: gunicorn invasion_site.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invasion-cardigan-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Europe/Paris

databases:
  - name: invasion-cardigan-postgres
    databaseName: invasion_cardigan
    user: invasion_cardigan
    plan: basic-256mb
